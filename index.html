<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секундомер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            /* По умолчанию (портрет): круги друг над другом — сверху и снизу */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2vmin;
            padding: 1vmin;
        }

        /* Ландшафт (телефон перевёрнут): круги слева и справа */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }
        }

        .circle {
            /* Портрет: диаметр ограничен и шириной (один круг в строке), и высотой (два круга в столбце) */
            --size: min(96vw, 48vh);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: filter 0.15s ease;
            touch-action: manipulation;
            overflow: hidden;
            flex: 0 0 auto;
        }

        /* Ландшафт: диаметр ограничен высотой (один круг в строке) и шириной (два круга в ряд) */
        @media (orientation: landscape) {
            .circle {
                --size: min(48vw, 96vh);
            }
        }

        .circle:active {
            filter: brightness(1.2);
        }

        .blue {
            background: #2196f3;
            box-shadow: 0 0 4vmin rgba(33, 150, 243, 0.5), inset 0 0 6vmin rgba(0, 0, 0, 0.3);
        }

        .red {
            background: #f44336;
            box-shadow: 0 0 4vmin rgba(244, 67, 54, 0.5), inset 0 0 6vmin rgba(0, 0, 0, 0.3);
        }

        .time {
            color: #fff;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            white-space: nowrap;
            z-index: 2;
            text-shadow:
                -0.3vmin -0.3vmin 0 #000,
                 0.3vmin -0.3vmin 0 #000,
                -0.3vmin  0.3vmin 0 #000,
                 0.3vmin  0.3vmin 0 #000,
                -0.3vmin  0       0 #000,
                 0.3vmin  0       0 #000,
                 0       -0.3vmin 0 #000,
                 0        0.3vmin 0 #000;
        }
    </style>
</head>
<body>
    <div class="circle blue" id="blueCircle">
        <div class="time" id="blueTime">00.00</div>
    </div>
    <div class="circle red" id="redCircle">
        <div class="time" id="redTime">00.00</div>
    </div>

    <script>
        class Stopwatch {
            constructor(element) {
                this.el = element;
                this.running = false;
                this.startTime = 0;
                this.elapsed = 0;
                this.rafId = null;
                this.render = this.render.bind(this);
            }

            format(ms) {
                const totalHundredths = Math.floor(ms / 10);
                const hundredths = totalHundredths % 100;
                const seconds = Math.floor(totalHundredths / 100);
                return `${String(seconds).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}`;
            }

            render() {
                const now = performance.now();
                const display = this.elapsed + (this.running ? (now - this.startTime) : 0);
                this.el.textContent = this.format(display);
                if (this.running) {
                    this.rafId = requestAnimationFrame(this.render);
                }
            }

            tap() {
                if (!this.running) {
                    // Старт (в том числе новый старт с нуля после остановки)
                    this.elapsed = 0;
                    this.startTime = performance.now();
                    this.running = true;
                    this.el.textContent = '00.00';
                    this.rafId = requestAnimationFrame(this.render);
                } else {
                    // Стоп
                    this.elapsed += performance.now() - this.startTime;
                    this.running = false;
                    cancelAnimationFrame(this.rafId);
                    this.render();
                }
            }
        }

        const blueSW = new Stopwatch(document.getElementById('blueTime'));
        const redSW = new Stopwatch(document.getElementById('redTime'));

        document.getElementById('blueCircle').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            blueSW.tap();
        });

        document.getElementById('redCircle').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            redSW.tap();
        });

        function fitText() {
            document.querySelectorAll('.circle').forEach(circle => {
                const timeEl = circle.querySelector('.time');
                const maxWidth = circle.clientWidth * 0.80;
                const maxHeight = circle.clientHeight * 0.80;

                let size = circle.clientHeight * 0.25;
                timeEl.style.fontSize = size + 'px';

                let guard = 100;
                while (guard-- > 0) {
                    if (timeEl.scrollWidth <= maxWidth && timeEl.scrollHeight <= maxHeight) break;
                    size *= 0.95;
                    timeEl.style.fontSize = size + 'px';
                }
                guard = 100;
                while (guard-- > 0) {
                    const newSize = size * 1.03;
                    timeEl.style.fontSize = newSize + 'px';
                    if (timeEl.scrollWidth > maxWidth || timeEl.scrollHeight > maxHeight) {
                        timeEl.style.fontSize = size + 'px';
                        break;
                    }
                    size = newSize;
                }
            });
        }

        window.addEventListener('resize', fitText);
        window.addEventListener('orientationchange', () => setTimeout(fitText, 100));
        window.addEventListener('load', fitText);
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(fitText);
            document.querySelectorAll('.circle').forEach(c => ro.observe(c));
        }
        fitText();

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
