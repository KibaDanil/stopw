<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Секундомер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Фиксированный слой на весь экран — не зависит от адресной строки */
        #app {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vmin;
            padding: 1vmin;
            /* Портрет: круги друг над другом */
            flex-direction: column;
        }

        @media (orientation: landscape) {
            #app {
                /* Ландшафт: круги в ряд */
                flex-direction: row;
            }
        }

        .circle {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: filter 0.15s ease;
            touch-action: manipulation;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .circle:active {
            filter: brightness(1.2);
        }

        .blue {
            background: #2196f3;
            box-shadow: 0 0 4vmin rgba(33, 150, 243, 0.5), inset 0 0 6vmin rgba(0, 0, 0, 0.3);
        }

        .red {
            background: #f44336;
            box-shadow: 0 0 4vmin rgba(244, 67, 54, 0.5), inset 0 0 6vmin rgba(0, 0, 0, 0.3);
        }

        .time {
            color: #fff;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            white-space: nowrap;
            z-index: 2;
            text-shadow:
                -0.3vmin -0.3vmin 0 #000,
                 0.3vmin -0.3vmin 0 #000,
                -0.3vmin  0.3vmin 0 #000,
                 0.3vmin  0.3vmin 0 #000,
                -0.3vmin  0       0 #000,
                 0.3vmin  0       0 #000,
                 0       -0.3vmin 0 #000,
                 0        0.3vmin 0 #000;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="circle blue" id="blueCircle">
            <div class="time" id="blueTime">00.00</div>
        </div>
        <div class="circle red" id="redCircle">
            <div class="time" id="redTime">00.00</div>
        </div>
    </div>

    <script>
        class Stopwatch {
            constructor(element) {
                this.el = element;
                this.running = false;
                this.startTime = 0;
                this.elapsed = 0;
                this.rafId = null;
                this.render = this.render.bind(this);
            }

            format(ms) {
                const totalHundredths = Math.floor(ms / 10);
                const hundredths = totalHundredths % 100;
                const seconds = Math.floor(totalHundredths / 100);
                return `${String(seconds).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}`;
            }

            render() {
                const now = performance.now();
                const display = this.elapsed + (this.running ? (now - this.startTime) : 0);
                this.el.textContent = this.format(display);
                if (this.running) {
                    this.rafId = requestAnimationFrame(this.render);
                }
            }

            tap() {
                if (!this.running) {
                    this.elapsed = 0;
                    this.startTime = performance.now();
                    this.running = true;
                    this.el.textContent = '00.00';
                    this.rafId = requestAnimationFrame(this.render);
                } else {
                    this.elapsed += performance.now() - this.startTime;
                    this.running = false;
                    cancelAnimationFrame(this.rafId);
                    this.render();
                }
            }
        }

        const blueSW = new Stopwatch(document.getElementById('blueTime'));
        const redSW = new Stopwatch(document.getElementById('redTime'));

        document.getElementById('blueCircle').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            blueSW.tap();
        });

        document.getElementById('redCircle').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            redSW.tap();
        });

        // Реальные размеры видимой области (учитывают адресную строку, панели, чёлку)
        function getViewport() {
            const vv = window.visualViewport;
            const w = vv ? vv.width : window.innerWidth;
            const h = vv ? vv.height : window.innerHeight;
            const offsetTop = vv ? vv.offsetTop : 0;
            const offsetLeft = vv ? vv.offsetLeft : 0;
            return { w, h, offsetTop, offsetLeft };
        }

        // Прибиваем #app к видимой области вручную — это единственный надёжный
        // способ центрировать при любых состояниях адресной строки и поворотах
        function layout() {
            const { w, h, offsetTop, offsetLeft } = getViewport();

            const app = document.getElementById('app');
            app.style.left = offsetLeft + 'px';
            app.style.top = offsetTop + 'px';
            app.style.width = w + 'px';
            app.style.height = h + 'px';

            const isLandscape = w >= h;
            const minSide = Math.min(w, h);
            const pad = Math.max(6, minSide * 0.01);
            const gap = Math.max(6, minSide * 0.02);

            let size;
            if (isLandscape) {
                // Круги в ряд: 2 круга + зазор + отступы по бокам должны поместиться в ширину,
                // и один круг — в высоту
                size = Math.min((w - pad * 2 - gap) / 2, h - pad * 2);
            } else {
                // Круги в столбец: 2 круга + зазор + отступы сверху/снизу должны поместиться в высоту,
                // и один круг — в ширину
                size = Math.min(w - pad * 2, (h - pad * 2 - gap) / 2);
            }
            size = Math.max(40, Math.floor(size));

            const circles = document.querySelectorAll('.circle');
            circles.forEach(c => {
                c.style.width = size + 'px';
                c.style.height = size + 'px';
            });

            fitText();
        }

        function fitText() {
            document.querySelectorAll('.circle').forEach(circle => {
                const timeEl = circle.querySelector('.time');
                const cw = circle.clientWidth;
                const ch = circle.clientHeight;
                if (!cw || !ch) return;

                const maxWidth = cw * 0.80;
                const maxHeight = ch * 0.80;

                let size = ch * 0.25;
                timeEl.style.fontSize = size + 'px';

                let guard = 100;
                while (guard-- > 0) {
                    if (timeEl.scrollWidth <= maxWidth && timeEl.scrollHeight <= maxHeight) break;
                    size *= 0.95;
                    timeEl.style.fontSize = size + 'px';
                }
                guard = 100;
                while (guard-- > 0) {
                    const newSize = size * 1.03;
                    timeEl.style.fontSize = newSize + 'px';
                    if (timeEl.scrollWidth > maxWidth || timeEl.scrollHeight > maxHeight) {
                        timeEl.style.fontSize = size + 'px';
                        break;
                    }
                    size = newSize;
                }
            });
        }

        function refresh() {
            // Двойной requestAnimationFrame, чтобы размеры успели примениться
            // после поворота/изменения адресной строки
            requestAnimationFrame(() => requestAnimationFrame(layout));
        }

        window.addEventListener('resize', refresh);
        window.addEventListener('orientationchange', () => setTimeout(refresh, 200));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', refresh);
            window.visualViewport.addEventListener('scroll', refresh);
        }
        window.addEventListener('load', refresh);
        refresh();

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
